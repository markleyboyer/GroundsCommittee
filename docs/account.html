<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account · Grounds Committee</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<main>
  <h1>Your account</h1>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
    <form class="card" id="profile">
      <h3>Contact details</h3>
      <label>Email for reminders</label><input name="email" type="email">
      <label>Your building</label><select name="building"></select>
      <div class="actions"><button class="btn">Save</button></div>
    </form>
    <form class="card" id="pwform">
      <h3>Change password</h3>
      <label>Current password</label><input name="cur" type="password" autocomplete="current-password" required>
      <label>New password (at least 8 characters)</label><input name="next" type="password" minlength="8" autocomplete="new-password" required>
      <div class="actions"><button class="btn">Change password</button></div>
    </form>
  </div>
</main>
<script type="module">
import { startPage, db, fail, toast, BUILDINGS } from "./js/app.js";
import { doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { EmailAuthProvider, reauthenticateWithCredential, updatePassword } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const ctx = await startPage({ page: "account.html" });
const p = document.getElementById("profile");
p.building.innerHTML = `<option value="">—</option>` + BUILDINGS.map(b => `<option>${b}</option>`).join("");
p.email.value = ctx.member.email || ""; p.building.value = ctx.member.building || "";
p.onsubmit = async e => {
  e.preventDefault();
  try { await updateDoc(doc(db, "members", ctx.user.uid), { email: p.email.value.trim(), building: p.building.value }); toast("Saved"); }
  catch (err) { fail(err); }
};
const f = document.getElementById("pwform");
f.onsubmit = async e => {
  e.preventDefault();
  try {
    await reauthenticateWithCredential(ctx.user, EmailAuthProvider.credential(ctx.user.email, f.cur.value));
    await updatePassword(ctx.user, f.next.value);
    f.reset(); toast("Password changed");
  } catch (err) { fail(/credential|wrong/i.test(err.code || "") ? new Error("Your current password didn't match.") : err); }
};
</script>
</body>
</html>
